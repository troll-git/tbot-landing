name: Deploy Landing Page to Scaleway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install s3cmd
        run: sudo apt-get install -y s3cmd

      - name: Configure Scaleway Object Storage
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.SCW_ACCESS_KEY }}
          secret_key = ${{ secrets.SCW_SECRET_KEY }}
          host_base = s3.fr-par.scw.cloud
          host_bucket = %(bucket)s.s3.fr-par.scw.cloud
          bucket_location = fr-par
          use_https = True
          mime_type=text/css css
          EOF
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Sync files to Scaleway
        run: s3cmd sync ./ s3://landing-tbot/ --delete-removed --acl-public --guess-mime-type

