name: Deploy Landing Page to Scaleway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install s3cmd
        run: sudo apt-get update && sudo apt-get install -y s3cmd

      - name: Configure Scaleway Object Storage
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.SCW_ACCESS_KEY }}
          secret_key = ${{ secrets.SCW_SECRET_KEY }}
          host_base = s3.fr-par.scw.cloud
          host_bucket = %(bucket)s.s3.fr-par.scw.cloud
          bucket_location = fr-par
          use_https = True
          EOF

      # -------------------------
      # 1. Upload CSS correctly
      # -------------------------
      - name: Upload CSS with correct MIME type
        run: |
          find css -name "*.css" | while read file; do
            echo "Uploading $file with text/css"
            s3cmd put "$file" "s3://landing-tbot/$file" \
              --acl-public \
              --mime-type="text/css" \
              --no-mime-magic
          done

      # -------------------------
      # 2. Upload everything else
      # -------------------------
      - name: Sync remaining files
        run: |
          s3cmd sync ./ s3://landing-tbot/ \
            --delete-removed \
            --acl-public \
            --exclude "css/*" \
            --guess-mime-type

      # -------------------------
      # 3. Verify deployment (debug)
      # -------------------------
      - name: Verify CSS headers
        run: |
          curl -I https://landing-tbot.s3-website.fr-par.scw.cloud/css/style.css || true